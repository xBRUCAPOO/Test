<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- [v1.2.0] viewport-fit=cover: la página usa toda la pantalla del celular (notch / barra inferior) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- [v1.2.0] Color de la barra del navegador en celular (coincide con --color-bg del CSS) -->
  <meta name="theme-color" content="#0a0b0e">
  <title>Test</title>

  <!-- Conexión previa a Google Fonts: acelera la carga de tipografías e iconos -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Tipografías (Google Fonts): Space Grotesk (textos y títulos) e IBM Plex Mono (etiquetas y números) -->
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">

  <!-- Iconos (Google Fonts Icons): Material Symbols Outlined -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">

  <!-- Estilos externos -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Fondo sutil: grilla de puntos estática y un resplandor tenue arriba -->
  <div class="bg" aria-hidden="true">
    <div class="bg__dots"></div>
    <div class="bg__glow"></div>
  </div>

  <main class="app">

    <!-- Barra superior: marca y estado actual (MENÚ / LISTO / EN CURSO / FINALIZADO) -->
    <header class="topbar">
      <div class="brand">
        <span class="brand__mark"><span class="material-symbols-outlined">quiz</span></span>
        <span class="brand__name">Test</span>
      </div>
      <div class="topbar__tag"><span class="topbar__dot"></span><span id="topTag">MENÚ</span></div>
    </header>

    <!-- [v1.2.0] PANTALLA 0: menú. Lista los tests detectados en tests/index.json para elegir cuál hacer -->
    <section class="screen screen--active" id="screenMenu">
      <p class="eyebrow">Evaluación</p>
      <h1 class="title" id="menuTitle">Test</h1>
      <p class="subtitle">Elegí un test para empezar.</p>

      <!-- Aviso del menú (info / warning / error): cargando, sin tests o error al leer los JSON. Lo maneja script.js -->
      <div class="notice notice--info" id="menuNotice">
        <span class="material-symbols-outlined" id="menuNoticeIcon">hourglass_top</span>
        <p id="menuNoticeText">Cargando tests…</p>
      </div>

      <!-- Tarjetas de los tests (las crea script.js) -->
      <div class="menu" id="menuList"></div>
    </section>

    <!-- PANTALLA 1: inicio del test elegido. Muestra nombre, tema, cantidad de preguntas y el botón para comenzar -->
    <section class="screen" id="screenStart">
      <p class="eyebrow">Evaluación</p>
      <h1 class="title" id="mainTitle">Test</h1>
      <p class="subtitle" id="testTopic"></p>

      <div class="stats">
        <div class="stat">
          <span class="material-symbols-outlined">help</span>
          <div><strong id="statCount">0</strong><small>preguntas</small></div>
        </div>
        <div class="stat">
          <span class="material-symbols-outlined">grade</span>
          <div><strong>10</strong><small>puntaje máx.</small></div>
        </div>
      </div>

      <!-- [v1.2.0] Botones: Comenzar + Cambiar test (vuelve al menú) -->
      <div class="actions">
        <button class="btn btn--primary" id="btnStart" type="button">
          <span>Comenzar</span>
          <span class="material-symbols-outlined">arrow_forward</span>
        </button>
        <button class="btn btn--ghost" id="btnChange" type="button">
          <span class="material-symbols-outlined">swap_horiz</span>
          <span>Cambiar test</span>
        </button>
      </div>
    </section>

    <!-- PANTALLA 2: test. Progreso, pregunta actual, opciones y navegación -->
    <section class="screen" id="screenQuiz">
      <div class="progress">
        <div class="progress__head">
          <span class="eyebrow">Pregunta</span>
          <span class="progress__count" id="qCounter">01 / 01</span>
        </div>
        <div class="progress__track"><div class="progress__bar" id="progressBar"></div></div>
      </div>

      <article class="qcard" id="qCard">
        <!-- [v1.3.0] Tema de la pregunta: texto pequeño gris, opcional (campo "tema" de cada pregunta en el JSON).
             Si la pregunta no tiene tema queda vacío y el CSS lo oculta. Lo completa script.js -->
        <p class="qtopic" id="qTopic"></p>
        <h2 class="qtext" id="qText"></h2>
        <div class="options" id="options" role="radiogroup" aria-label="Opciones de respuesta"></div>
      </article>

      <div class="quiz__nav">
        <button class="btn btn--ghost" id="btnPrev" type="button">
          <span class="material-symbols-outlined">arrow_back</span>
          <span>Anterior</span>
        </button>
        <button class="btn btn--primary" id="btnNext" type="button" disabled>
          <span id="btnNextLabel">Siguiente</span>
          <span class="material-symbols-outlined" id="btnNextIcon">arrow_forward</span>
        </button>
      </div>

      <!-- [v1.3.0] "Terminar test": permite cerrar el test en cualquier momento. Las preguntas sin contestar
           quedan marcadas en gris en los resultados y la nota se muestra como "Incompleto" -->
      <div class="quiz__finish">
        <button class="btn btn--ghost btn--sm" id="btnFinish" type="button">
          <span class="material-symbols-outlined">stop_circle</span>
          <span>Terminar test</span>
        </button>
      </div>
    </section>

  </main>

  <!-- FLOAT DE RESULTADOS: puntaje 0/10 arriba y debajo todas las respuestas elegidas (verde = bien, rojo = mal, gris = sin responder).
       [v1.3.0] Si el test se terminó antes, debajo del puntaje aparece "Incompleto" (naranja) y los 2 promedios.
       En celular se muestra como panel que sube desde abajo -->
  <div class="float" id="resultFloat" hidden role="dialog" aria-modal="true" aria-labelledby="resultTitle">
    <div class="float__panel">

      <!-- id="scoreBox": script.js le pone data-tone (success / warning / error) para colorear aro y mensaje -->
      <div class="float__head" id="scoreBox" data-tone="success">
        <p class="eyebrow" id="resultTitle">Resultado</p>
        <div class="score">
          <svg class="score__ring" viewBox="0 0 120 120" aria-hidden="true">
            <circle class="score__track" cx="60" cy="60" r="52"></circle>
            <circle class="score__bar" id="scoreBar" cx="60" cy="60" r="52"></circle>
          </svg>
          <div class="score__text">
            <span class="score__value" id="scoreValue">0</span><span class="score__max">/10</span>
          </div>
        </div>
        <!-- [v1.3.0] "Incompleto": solo se muestra si quedaron preguntas sin contestar (color warning). Lo maneja script.js -->
        <p class="score__incomplete" id="scoreIncomplete" hidden>Incompleto</p>
        <p class="score__msg" id="scoreMsg"></p>
        <!-- [v1.3.0] Los 2 promedios (solo si el test quedó incompleto):
             General = sobre todas las preguntas, las sin contestar suman 0 (es el valor del aro).
             Contestadas = solo sobre las preguntas que sí se contestaron -->
        <div class="score__avgs" id="scoreAvgs" hidden>
          <span class="score__avg" title="Sobre todas las preguntas: las sin contestar suman 0">
            <small>General</small><strong id="avgAll">0</strong><span class="score__avg-max">/10</span>
          </span>
          <span class="score__avg" title="Solo sobre las preguntas contestadas">
            <small>Contestadas</small><strong id="avgAnswered">0</strong><span class="score__avg-max">/10</span>
          </span>
        </div>
        <p class="score__meta" id="scoreMeta"></p>
      </div>

      <div class="float__body">
        <h2 class="review__title">Tus respuestas</h2>
        <ol class="review" id="reviewList"></ol>
      </div>

      <!-- [v1.2.0] "Menú" reemplaza a "Inicio": vuelve a la lista para elegir otro test -->
      <div class="float__foot">
        <button class="btn btn--ghost" id="btnHome" type="button">
          <span class="material-symbols-outlined">apps</span>
          <span>Menú</span>
        </button>
        <button class="btn btn--primary" id="btnRetry" type="button">
          <span class="material-symbols-outlined">replay</span>
          <span>Reintentar</span>
        </button>
      </div>

    </div>
  </div>

  <!-- Footer con versión y fecha (actualizar cada vez que se modifique este archivo) -->
  <footer class="footer">
    <span>Test</span>
    <span class="footer__sep">·</span>
    <!-- [v1.3.0] versión y fecha actualizadas por los cambios de esta entrega -->
    <span id="footerVersion">v1.3.0</span>
    <span class="footer__sep">·</span>
    <span id="footerDate">08/10/2026</span>
  </footer>

  <!-- Lógica externa -->
  <script src="script.js"></script>
</body>
</html>
